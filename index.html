<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sazzad's AI Study Buddy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #38bdf8; font-size: 24px; }

        .main-card {
            background: #1e293b;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        .upload-area {
            border: 2px dashed #38bdf8;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            display: block;
            margin-bottom: 20px;
        }

        input[type="file"] { display: none; }

        .status-box { font-size: 13px; text-align: center; margin-bottom: 15px; color: #fbbf24; }

        .question-section {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        .question-text { font-size: 18px; color: #fff; margin-bottom: 15px; line-height: 1.6; }

        .btn-voice { background: #38bdf8; color: #000; padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-next { background: #4ade80; color: #000; padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }

        .error-msg { color: #ff4d4d; font-size: 12px; margin-top: 5px; display: block; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <h1>AI Study Buddy</h1>
        <p>সাজ্জাদ, তোমার বইয়ের পৃষ্ঠার ছবি দাও</p>
    </div>

    <div class="main-card">
        <label for="imageUpload" class="upload-area">
            <i class="fas fa-camera"></i>
            <p>ছবি সিলেক্ট করো</p>
        </label>
        <input type="file" id="imageUpload" accept="image/*">
        <span id="inputError" class="error-msg"></span>

        <div id="status" class="status-box"></div>

        <div class="question-section" id="qSection">
            <div class="question-text" id="qText">সাজ্জাদ, আমি তোমার পড়াটি শুনছি...</div>
            <button class="btn-voice" id="speakBtn"><i class="fas fa-volume-up"></i> কথা শুনুন</button>
            <button class="btn-next" id="nextBtn">পরের প্রশ্ন</button>
        </div>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const status = document.getElementById('status');
        const qSection = document.getElementById('qSection');
        const qText = document.getElementById('qText');
        const inputError = document.getElementById('inputError');
        const speakBtn = document.getElementById('speakBtn');
        const nextBtn = document.getElementById('nextBtn');

        let extractedSentences = [];
        const synth = window.speechSynthesis;

        imageUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            status.textContent = "পড়া হচ্ছে... একটু সময় দাও সাজ্জাদ।";
            qSection.style.display = "none";

            try {
                const result = await Tesseract.recognize(file, 'ben');
                const text = result.data.text;
                extractedSentences = text.split(/[।!?\n]/).filter(s => s.trim().length > 15);
                
                if (extractedSentences.length > 0) {
                    status.textContent = "পড়া শেষ! বাটনে ক্লিক করো।";
                    qSection.style.display = "block";
                    generateQuestion();
                } else {
                    inputError.textContent = "ছবিতে কোনো পরিষ্কার বাংলা লেখা পাওয়া যায়নি।";
                }
            } catch (err) {
                inputError.textContent = "সমস্যা হয়েছে। আবার চেষ্টা করো সাজ্জাদ।";
            }
        });

        function generateQuestion() {
            const randomIndex = Math.floor(Math.random() * extractedSentences.length);
            let sentence = extractedSentences[randomIndex].trim();
            qText.textContent = "প্রশ্ন: " + sentence;
        }

        function speak() {
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(qText.textContent);
            
            // সাজ্জাদ, এখানে আমরা বাংলা ভয়েস সেট করার চেষ্টা করছি
            const voices = synth.getVoices();
            const bnVoice = voices.find(v => v.lang.includes('bn') || v.lang.includes('Bengali'));
            if (bnVoice) utterance.voice = bnVoice;

            utterance.lang = 'bn-BD';
            utterance.rate = 0.8; 
            synth.speak(utterance);
        }

        speakBtn.onclick = speak;
        nextBtn.onclick = () => {
            generateQuestion();
            speak();
        };

        // সাজ্জাদ, ভয়েস লোড হতে সময় নিতে পারে তাই এই ফাংশনটি রাখা
        window.speechSynthesis.onvoiceschanged = () => {
            console.log("Voices loaded");
        };
    </script>
</body>
</html>
